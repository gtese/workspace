# ==============================================================================
# slurm.conf - Slurm 集群配置
# 集群: tricluster | 控制节点: trivm123 | 计算节点: trivm131/132/133 + eda151-155 (2026-11-09 新增)
# ==============================================================================

# ---------- 集群标识 ----------
ClusterName=tricluster
SlurmctldHost=trivm123(172.16.50.123)

# ----- 提交插件: 新节点强制要求显式 --mem (2026-11-09) -----
JobSubmitPlugins=lua

# ---------- 用户与进程 ----------
SlurmUser=slurm
SlurmdUser=root
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
MailProg=/usr/bin/mail
MpiDefault=none
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
ReturnToService=2
SwitchType=switch/none

# ---------- 调度 ----------
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# ---------- 日志 ----------
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# ---------- 记账 (slurmdbd, 稍后启用) ----------
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=trivm123
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

# ---------- 超时 ----------
SlurmctldTimeout=120
SlurmdTimeout=300
MinJobAge=259200
KillWait=30
Waittime=0
MaxJobCount=10000
DefMemPerCPU=0

# ---------- 节点 ----------
NodeName=172.16.50.131 NodeHostname=trivm131 NodeAddr=172.16.50.131 CPUs=128 Boards=1 SocketsPerBoard=32 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=117000 State=UNKNOWN Feature=eda
NodeName=172.16.50.132 NodeHostname=trivm132 NodeAddr=172.16.50.132 CPUs=128 Boards=1 SocketsPerBoard=32 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=117000 State=UNKNOWN Feature=eda
NodeName=172.16.50.133 NodeHostname=trivm133 NodeAddr=172.16.50.133 CPUs=128 Boards=1 SocketsPerBoard=32 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=194560 State=UNKNOWN Feature=eda
NodeName=172.16.50.150 NodeHostname=eda NodeAddr=172.16.50.150 CPUs=384 Boards=1 SocketsPerBoard=2 CoresPerSocket=96 ThreadsPerCore=2 RealMemory=409600 State=UNKNOWN Feature=eda,bigmem

# ----- 新增 eda151-155 (2026-11-09): 2TB 内存机型, 每节点 112 vCPU -----
NodeName=172.16.50.151 NodeHostname=eda151 NodeAddr=172.16.50.151 CPUs=112 Boards=1 SocketsPerBoard=2 CoresPerSocket=28 ThreadsPerCore=2 RealMemory=1945600 State=UNKNOWN Feature=eda,bigmem
NodeName=172.16.50.152 NodeHostname=eda152 NodeAddr=172.16.50.152 CPUs=112 Boards=1 SocketsPerBoard=2 CoresPerSocket=28 ThreadsPerCore=2 RealMemory=1945600 State=UNKNOWN Feature=eda,bigmem
NodeName=172.16.50.153 NodeHostname=eda153 NodeAddr=172.16.50.153 CPUs=112 Boards=1 SocketsPerBoard=2 CoresPerSocket=28 ThreadsPerCore=2 RealMemory=1945600 State=UNKNOWN Feature=eda,bigmem
NodeName=172.16.50.154 NodeHostname=eda154 NodeAddr=172.16.50.154 CPUs=112 Boards=1 SocketsPerBoard=2 CoresPerSocket=28 ThreadsPerCore=2 RealMemory=1945600 State=UNKNOWN Feature=eda,bigmem
NodeName=172.16.50.155 NodeHostname=eda155 NodeAddr=172.16.50.155 CPUs=112 Boards=1 SocketsPerBoard=2 CoresPerSocket=28 ThreadsPerCore=2 RealMemory=1945600 State=UNKNOWN Feature=eda,bigmem

# ---------- 分区 ----------

# ===== 分区定义 =====
# eda: 主力计算节点 (150, 384核/360G), 默认分区

# localhost: 本地辅助节点 (133, 32核/190G)

# ============================================================================
# 提交节点绑定策略 (2026-11-03)
# 每台计算节点只接受"本机提交"的作业，外加 150 作为共享节点
# 由 /etc/slurm/lua/job_submit.lua 强制执行
# ============================================================================

# 131 提交的作业 → 131 或 150（单节点）

# 132 提交的作业 → 132 或 150（单节点）

# 133 提交的作业 → 133 或 150（单节点）

# 150 提交的作业 → 只能 150
PartitionName=eda Nodes=172.16.50.131,172.16.50.132,172.16.50.133,172.16.50.150 Default=NO MaxTime=INFINITE State=UP

# ===== 新增节点分区 eda151-155 (2026-11-09) =====
# 151 提交的作业 → 151 或 150

# 152 提交的作业 → 152 或 150

# 153 提交的作业 → 153 或 150

# 154 提交的作业 → 154 或 150

# 155 提交的作业 → 155 或 150

# ===== 新增 5 台大内存节点共享分区 (2026-11-09) =====
# 用于跨 eda151-155 的多节点作业（原 node15x 分区只含本机+150，无法跨 5 台）
PartitionName=eda15x Nodes=172.16.50.151,172.16.50.152,172.16.50.153,172.16.50.154,172.16.50.155 Default=YES MaxTime=INFINITE State=UP
