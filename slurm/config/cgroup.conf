# ==============================================================================
# cgroup.conf - Slurm cgroup 资源隔离配置
# 作用: 限制作业的 CPU/内存，防止单作业拖垮节点
# ==============================================================================
CgroupAutomount=yes
CgroupMountpoint=/sys/fs/cgroup

ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
ConstrainDevices=no

AllowedRAMSpace=100
AllowedSwapSpace=0
MaxRAMPercent=98
MaxSwapPercent=90
MinRAMSpace=30
