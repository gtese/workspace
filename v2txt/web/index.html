<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2TXT · 录音转文字与智能纪要</title>
<link rel="stylesheet" href="/static/assets/style.css">
<style>
  .nav { display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
  .logo { font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .logo em { color:var(--brand); font-style:normal; }
  .feats { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .feat h3 { margin-bottom:6px; }
  .icon { width:38px; height:38px; border-radius:10px; background:var(--brand-soft); color:var(--brand);
          display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:12px; }
  .price { display:flex; flex-direction:column; gap:10px; }
  .price .amt { font-size:30px; font-weight:750; }
  .price ul { margin:0; padding-left:18px; color:var(--muted); font-size:14px; }
  .cta { display:flex; gap:10px; }
  footer { padding:36px 0; color:var(--muted); font-size:13px; border-top:1px solid var(--line); margin-top:40px; }
  @media (max-width:780px){ .feats{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <div class="logo">V2<em>TXT</em></div>
    <div class="cta">
      <button class="btn ghost" id="langBtn">EN</button>
      <a class="btn" href="/login" data-t="signin">登录</a>
      <a class="btn primary" href="/register" data-t="signup">免费注册</a>
    </div>
  </div>

  <section class="hero">
    <span class="badge" id="bonusBadge">注册即送 60 分钟</span>
    <h1 style="margin:16px 0 14px" id="heroTitle">把会议录音<br>变成可执行的纪要</h1>
    <p class="muted" style="font-size:17px;max-width:620px" id="heroSub">
      网页直接录音或上传音视频，自动转写、区分发言人、生成中文/英文纪要，支持分享与导出。
    </p>
    <div class="row" style="margin:26px 0 8px">
      <a class="btn primary" href="/register" style="padding:12px 24px;font-size:15px" id="ctaMain">免费开始</a>
      <a class="btn" href="/login" style="padding:12px 22px;font-size:15px" id="ctaSub">已有账号</a>
    </div>
    <p class="tiny muted" id="pricingHint">$0.02 / 分钟，用多少付多少</p>
  </section>

  <section class="section">
    <div class="feats">
      <div class="feat card">
        <div class="icon">🎙</div>
        <h3 id="f1t">一键录音</h3>
        <p class="muted small" id="f1d">浏览器直接录音，弱网自动重传，5 分钟分段不丢音频。</p>
      </div>
      <div class="feat card">
        <div class="icon">⚡️</div>
        <h3 id="f2t">智能纪要</h3>
        <p class="muted small" id="f2d">转写 + 发言人区分 + 决议/待办提取，中英双语输出。</p>
      </div>
      <div class="feat card">
        <div class="icon">🔗</div>
        <h3 id="f3t">安全分享</h3>
        <p class="muted small" id="f3d">签名链接 30 天有效，可随时撤销，访问行为有审计。</p>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 style="margin-bottom:16px" id="planTitle">套餐</h2>
    <div class="grid3" id="plans"><p class="muted small">加载中…</p></div>
  </section>

  <footer>
    <div class="spread">
      <span>© <span id="year"></span> V2TXT</span>
      <span class="row">
        <a href="/login" class="tiny" data-t="signin">登录</a>
        <a href="/register" class="tiny" data-t="signup">注册</a>
      </span>
    </div>
  </footer>
</div>

<script src="/static/assets/api.js"></script>
<script>
const { Api } = UI;
const zh = Api.lang === 'zh';
document.getElementById('langBtn').textContent = zh ? 'EN' : '中文';
document.getElementById('year').textContent = new Date().getFullYear();

const L = zh ? {
  hero: '把会议录音<br>变成可执行的纪要',
  sub: '网页直接录音或上传音视频，自动转写、区分发言人、生成中文/英文纪要，支持分享与导出。',
  cta: '免费开始', sub2: '已有账号', hint: '$0.02 / 分钟，用多少付多少',
  f1t: '一键录音', f1d: '浏览器直接录音，弱网自动重传，5 分钟分段不丢音频。',
  f2t: '智能纪要', f2d: '转写 + 发言人区分 + 决议/待办提取，中英双语输出。',
  f3t: '安全分享', f3d: '签名链接 30 天有效，可随时撤销，访问行为有审计。',
  plan: '套餐', per: '/期', min: '分钟', incl: '含', free: '免费',
} : {
  hero: 'Turn meeting audio<br>into actionable minutes',
  sub: 'Record in the browser or upload audio/video. Automatic transcription, speaker labels, bilingual minutes, share and export.',
  cta: 'Start free', sub2: 'Sign in', hint: '$0.02 per minute, pay as you go',
  f1t: 'One-click recording', f1d: 'Record in the browser with automatic retry, never lose a segment.',
  f2t: 'Smart minutes', f2d: 'Transcription, speaker diarization, decisions and action items.',
  f3t: 'Safe sharing', f3d: 'Signed links valid 30 days, revocable, with access audit.',
  plan: 'Pricing', per: '/mo', min: 'minutes', incl: 'includes', free: 'Free',
};
document.getElementById('heroTitle').innerHTML = L.hero;
document.getElementById('heroSub').textContent = L.sub;
document.getElementById('ctaMain').textContent = L.cta;
document.getElementById('ctaSub').textContent = L.sub2;
document.getElementById('pricingHint').textContent = L.hint;
document.getElementById('f1t').textContent = L.f1t;
document.getElementById('f1d').textContent = L.f1d;
document.getElementById('f2t').textContent = L.f2t;
document.getElementById('f2d').textContent = L.f2d;
document.getElementById('f3t').textContent = L.f3t;
document.getElementById('f3d').textContent = L.f3d;
document.getElementById('planTitle').textContent = L.plan;
document.getElementById('langBtn').onclick = () => Api.setLang(zh ? 'en' : 'zh');

if (Api.token) { location.href = '/app'; }

(async () => {
  try {
    const cfg = await fetch('/api/v1/config').then(r => r.json());
    if (cfg.signup_bonus_minutes > 0) {
      document.getElementById('bonusBadge').textContent =
        (zh ? '注册即送 ' : 'Sign up bonus: ') + cfg.signup_bonus_minutes + (zh ? ' 分钟' : ' min');
    }
    const data = await fetch('/api/v1/billing/plans').then(r => r.json());
    const box = document.getElementById('plans');
    box.innerHTML = data.items.map(p => `
      <div class="card price">
        <div class="spread"><h3>${p.name}</h3>${p.price_usd === 0
          ? `<span class="badge gray">${L.free}</span>`
          : `<span class="badge">$${p.price_usd}</span>`}</div>
        <div class="amt">${p.price_usd === 0 ? '$0' : '$' + p.price_usd}<span class="small muted">${L.per}</span></div>
        <div class="small muted">${L.incl} ${p.minutes_included} ${L.min}</div>
        <ul>${p.features.map(f => `<li>${f}</li>`).join('')}</ul>
        <a class="btn block ${p.price_usd > 0 ? 'primary' : ''}" href="/register">${L.cta}</a>
      </div>`).join('');
  } catch (e) { /* 忽略首屏加载失败 */ }
})();
</script>
</body>
</html>
