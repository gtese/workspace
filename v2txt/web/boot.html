<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V2TXT</title>
<script>
// 极简跳板：不加载任何外部资源，有会话直接进控制台，否则去官网首页
(function(){
  var t = null, slug = '';
  try { t = localStorage.getItem('vt_token'); } catch (e) {}
  var m = location.pathname.match(/^\/e\/([^/]+)/);
  if (m) { slug = decodeURIComponent(m[1]); }
  try { if (slug) sessionStorage.setItem('feishu_app', slug); } catch (e) {}
  location.replace(t ? '/app' : (slug ? '/login' : '/home'));
})();
</script></head>
<body style="font:14px system-ui;padding:24px;color:#666">正在进入 V2TXT…</body></html>
