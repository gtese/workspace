<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2TXT · 运营后台</title>
<link rel="stylesheet" href="/static/assets/style.css?v=20261126d">
<style>
  .layout{display:flex;min-height:100vh}
  .side{width:200px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
  .side .brand{font-weight:800;font-size:17px;padding:0 8px 14px}
  .side .brand em{color:var(--brand);font-style:normal}
  .side a{display:block;padding:9px 10px;border-radius:8px;color:#374151;font-size:14px;margin-bottom:2px}
  .side a:hover{background:#f3f4f6;text-decoration:none}
  .side a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .main{flex:1;padding:20px 24px;min-width:0}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input{max-width:260px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:#fafafa;cursor:pointer;white-space:nowrap}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  .pager{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
  .badge.ok{background:#ecfdf5;color:#059669}.badge.err{background:#fef2f2;color:#dc2626}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">V2<em>TXT</em> 运营</div>
    <a href="#overview" data-nav="overview">概览</a>
    <a href="#users" data-nav="users">用户</a>
    <a href="#orgs" data-nav="orgs">团队</a>
    <a href="#orders" data-nav="orders">订单</a>
    <a href="#events" data-nav="events">审计事件</a>
    <a href="#apps" data-nav="apps">企业应用</a>
    <div style="margin-top:18px;padding:0 8px" class="tiny muted" id="roleBox"></div>
    <div style="margin-top:8px;padding:0 8px"><a href="/app" class="tiny">← 返回控制台</a></div>
  </aside>

  <main class="main">
    <div class="spread" style="margin-bottom:14px">
      <h2 id="pageTitle">概览</h2>
      <div class="row"><span class="tiny muted" id="meMail"></span><button class="btn small" id="logout">退出</button></div>
    </div>

    <section id="view-overview">
      <div class="kpi" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
        <div class="card"><span class="muted small">用户</span><b id="kUsers">-</b></div>
        <div class="card"><span class="muted small">团队</span><b id="kOrgs">-</b></div>
        <div class="card"><span class="muted small">录音（30天）</span><b id="kRecs">-</b></div>
        <div class="card"><span class="muted small">待确认订单</span><b id="kPending">-</b></div>
      </div>
    </section>

    <section id="view-table" class="hide">
      <div class="toolbar">
        <input type="text" id="q" placeholder="搜索…">
        <button class="btn small" id="doSearch">搜索</button>
        <select id="pageSize" style="max-width:110px"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
        <button class="btn small" id="exportCsv">导出 CSV</button>
        <span class="tiny muted" id="tableHint"></span>
      </div>
      <div style="overflow:auto;max-height:calc(100vh - 190px)"><table id="grid"></table></div>
      <div class="pager">
        <button class="btn small" id="prevPage">上一页</button>
        <span id="pageInfo">1</span>
        <button class="btn small" id="nextPage">下一页</button>
      </div>
    </section>

    <section id="view-apps" class="hide">
      <div class="card" style="margin-bottom:16px">
        <h3>已接入企业</h3>
        <div class="list" id="appList" style="margin-top:8px"><p class="muted small">加载中…</p></div>
      </div>
      <div class="card">
        <h3>新增企业应用</h3>
        <div class="stack" style="margin-top:10px">
          <label class="field"><span>企业名称</span><input type="text" id="faName"></label>
          <label class="field"><span>slug（可空）</span><input type="text" id="faSlug" placeholder="ent3"></label>
          <label class="field"><span>App ID</span><input type="text" id="faAppId"></label>
          <label class="field"><span>App Secret</span><input type="text" id="faSecret"></label>
          <button class="btn primary" id="faCreate">创建并生成登录地址</button>
          <p class="small" id="faResult"></p>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="/static/assets/api.js?v=20261126d"></script>
<script>
const { Api, toast, needAuth, fmtDate } = UI;
const $ = (id) => document.getElementById(id);
const zh = Api.lang === 'zh';
if (!needAuth()) throw new Error('redirecting');

const STATE = { view: 'overview', page: 0, size: 50, q: '', sortKey: '', sortAsc: false, rows: [], cols: [] };

const SCHEMAS = {
  users: {
    title: '用户', url: '/api/v1/admin/users',
    cols: [
      ['email', '邮箱'], ['name', '姓名'], ['ops_role', '角色'], ['status', '状态'],
      ['minutes', '剩余分钟'], ['email_verified', '邮箱确认'], ['created_at', '创建时间'],
    ],
  },
  orgs: {
    title: '团队', url: '/api/v1/admin/orgs',
    cols: [
      ['name', '名称'], ['kind', '类型'], ['feishu_tenant_key', '飞书租户'], ['members', '成员'],
      ['minutes', '余额'], ['plan', '套餐'], ['created_at', '创建时间'],
    ],
  },
  orders: {
    title: '订单', url: '/api/v1/admin/orders',
    cols: [
      ['id', '订单号'], ['org_name', '团队'], ['user_email', '提交人'], ['kind', '类型'],
      ['minutes', '分钟'], ['amount', '金额'], ['currency', '币种'], ['status', '状态'], ['created_at', '时间'],
    ],
  },
  events: {
    title: '审计事件', url: '/api/v1/admin/events',
    cols: [
      ['created_at', '时间'], ['action', '动作'], ['result', '结果'], ['actor', '用户'],
      ['ip', 'IP'], ['target', '目标'], ['detail', '详情'],
    ],
  },
};

function setView(v) {
  STATE.view = v;
  document.querySelectorAll('.side a[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === v));
  const isTable = !!SCHEMAS[v];
  $('view-overview').classList.toggle('hide', v !== 'overview');
  $('view-table').classList.toggle('hide', !isTable);
  $('view-apps').classList.toggle('hide', v !== 'apps');
  if (v === 'overview') { $('pageTitle').textContent = '概览'; loadOverview(); }
  else if (v === 'apps') { $('pageTitle').textContent = '企业应用'; loadApps(); }
  else { $('pageTitle').textContent = SCHEMAS[v].title; STATE.page = 0; loadTable(); }
}
window.addEventListener('hashchange', () => setView((location.hash || '#overview').slice(1)));
document.querySelectorAll('.side a[data-nav]').forEach(a => a.onclick = (e) => { e.preventDefault(); location.hash = '#' + a.dataset.nav; });

async function loadMe() {
  try {
    const me = await Api.req('/api/v1/me');
    $('meMail').textContent = me.email;
    const role = me.ops_role || (me.is_admin ? 'superadmin' : '');
    $('roleBox').textContent = role ? ('角色：' + role) : '无运营权限';
    if (!role) document.body.innerHTML = '<p style="padding:40px;text-align:center">无运营权限，请联系管理员</p>';
  } catch (e) { toast(e.message, true); }
}

async function loadOverview() {
  try {
    const d = await Api.req('/api/v1/admin/overview');
    $('kUsers').textContent = d.users; $('kOrgs').textContent = d.orgs;
    $('kRecs').textContent = d.recordings_30d; $('kPending').textContent = d.pending_orders;
  } catch (e) { toast(e.message, true); }
}

function cell(row, key) {
  let v = row[key];
  if (key === 'created_at' && v) return fmtDate(v, true);
  if (typeof v === 'boolean') return v ? '<span class="badge ok">是</span>' : '<span class="badge err">否</span>';
  if (v === null || v === undefined) return '';
  if (key === 'result') { const cls = v === 'ok' ? 'ok' : v === 'fail' ? 'err' : 'warn'; return `<span class="badge ${cls}">${v}</span>`; }
  const s = String(v);
  return s.length > 60 ? s.slice(0, 60) + '…' : s;
}

async function loadTable() {
  const sc = SCHEMAS[STATE.view];
  const p = new URLSearchParams();
  p.set('limit', STATE.size); p.set('offset', STATE.page * STATE.size);
  if (STATE.q) p.set('q', STATE.q);
  if (STATE.view === 'events') p.set('hours', '720');
  try {
    const d = await Api.req(sc.url + '?' + p.toString());
    let rows = d.items || [];
    if (STATE.sortKey) {
      rows = rows.slice().sort((a, b) => {
        const x = a[STATE.sortKey], y = b[STATE.sortKey];
        const r = (x === y) ? 0 : (x > y ? 1 : -1);
        return STATE.sortAsc ? r : -r;
      });
    }
    STATE.rows = rows;
    STATE.cols = sc.cols;
    renderTable();
  } catch (e) { toast(e.message, true); }
}

function renderTable() {
  const head = STATE.cols.map(([k, label]) =>
    `<th data-k="${k}">${label}${STATE.sortKey === k ? (STATE.sortAsc ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const body = STATE.rows.map(r => '<tr>' + STATE.cols.map(([k]) => `<td>${cell(r, k)}</td>`).join('') + '</tr>').join('')
    || `<tr><td colspan="${STATE.cols.length}" class="muted small">没有数据</td></tr>`;
  $('grid').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
  $('grid').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (STATE.sortKey === k) STATE.sortAsc = !STATE.sortAsc;
    else { STATE.sortKey = k; STATE.sortAsc = true; }
    renderTable();
  });
  $('pageInfo').textContent = `第 ${STATE.page + 1} 页 · ${STATE.rows.length} 条`;
  $('tableHint').textContent = STATE.q ? `搜索：${STATE.q}` : '';
}

$('doSearch').onclick = () => { STATE.q = $('q').value.trim(); STATE.page = 0; loadTable(); };
$('q').onkeydown = (e) => { if (e.key === 'Enter') $('doSearch').click(); };
$('pageSize').onchange = () => { STATE.size = Number($('pageSize').value); STATE.page = 0; loadTable(); };
$('prevPage').onclick = () => { if (STATE.page > 0) { STATE.page--; loadTable(); } };
$('nextPage').onclick = () => { if (STATE.rows.length === STATE.size) { STATE.page++; loadTable(); } };

$('exportCsv').onclick = () => {
  if (!STATE.rows.length) return;
  const cols = STATE.cols;
  const esc = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const csv = [cols.map(c => esc(c[1])).join(',')]
    .concat(STATE.rows.map(r => cols.map(([k]) => esc(r[k])).join(','))).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${STATE.view}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

async function loadApps() {
  try {
    const d = await Api.req('/api/v1/admin/feishu-apps');
    $('appList').innerHTML = d.items.length ? d.items.map(a => `
      <div class="item"><div class="grow"><b>${a.name}</b>
        <div class="tiny muted">slug=${a.slug} · ${a.app_id}</div>
        <div class="tiny" style="word-break:break-all">${a.login_url}</div></div>
        <button class="btn small" data-copy="${a.login_url}">复制</button></div>`).join('')
      : '<p class="muted small">还没有接入企业</p>';
    $('appList').querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '已复制 ✓'; } catch (e) { prompt('复制', b.dataset.copy); }
    });
  } catch (e) { toast(e.message, true); }
}

$('faCreate').onclick = async () => {
  const body = { name: $('faName').value.trim(), app_id: $('faAppId').value.trim(),
                 app_secret: $('faSecret').value.trim(), slug: $('faSlug').value.trim() };
  if (!body.name || !body.app_id || !body.app_secret) { toast('请填全', true); return; }
  try {
    const r = await Api.req('/api/v1/admin/feishu-apps', { method: 'POST', body });
    $('faResult').textContent = '已创建：' + r.login_url;
    $('faName').value = $('faSlug').value = $('faAppId').value = $('faSecret').value = '';
    loadApps();
  } catch (e) { toast(e.message, true); }
};

$('logout').onclick = async () => {
  try { await Api.req('/api/v1/auth/logout', { method: 'POST' }); } catch (e) { /* 忽略 */ }
  Api.setToken(''); location.href = '/login';
};

loadMe();
setView((location.hash || '#overview').slice(1));
</script>
</body>
</html>
