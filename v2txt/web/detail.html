<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纪要详情</title>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main>
  <div class="hero">
    <div class="brand">
      <span class="chip-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="3" fill="#1f6feb" opacity=".92"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#eaf3ff"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6M6 5l4 4M22 23l4 4M26 5l-4 4M10 23l-4 4" stroke="#4c9aff" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="1.6" fill="#1f6feb"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>纪要详情 <span class="badge">AI</span></h1>
        <div class="sub">摘要 · 待办 · 转写全文</div>
      </div>
      <a class="nav" href="/#records">录音记录 →</a>
    </div>
  </div>
  <div id="app" class="empty">加载中…</div>

  <div class="modal" id="renameModal" style="display:none">
    <div class="modal-card">
      <h3>修改说话人姓名</h3>
      <input id="renameInput" placeholder="例如：张三" value="">
      <div class="row">
        <button id="renameOk">保存</button>
        <button id="renameCancel" class="ghost">取消</button>
      </div>
    </div>
  </div>
</main>
<script>
const id = location.pathname.split('/').pop();
const isShared = location.pathname.startsWith('/s/');
const qs = new URLSearchParams(location.search);
const token = localStorage.getItem('vt_token') || '';
const org = localStorage.getItem('vt_org') || '';
const authHeaders = { ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(org ? { 'X-Org-Id': org } : {}) };
async function load() {
  const apiUrl = isShared
    ? '/api/v1/shared/' + id + '?exp=' + encodeURIComponent(qs.get('exp') || '') + '&sig=' + encodeURIComponent(qs.get('sig') || '')
    : '/api/v1/recordings/' + id;
  const r = await fetch(apiUrl, isShared ? {} : { headers: authHeaders });
  if (r.status === 401) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  if (!r.ok) {
    const detail = await r.text();
    const msg = r.status === 403 ? '分享链接已失效（可能已被撤销或过期）' : ('读取失败：' + detail);
    document.getElementById('app').innerHTML = '<div class="card"><h2>无法查看</h2><p class="meta">' + msg + '</p></div>';
    return;
  }
  const rec = await r.json();
  const s = rec.summary || {};
  const todo = (s.todos || []).map(t => `<li>${t.owner ? '<b>' + esc(t.owner) + '</b> ' : ''}${esc(t.item)}${t.due ? '（' + esc(t.due) + '）' : ''}</li>`).join('');
  const lines = (rec.transcript || []).map(t => {
    const mm = String(Math.floor(t.start / 60)).padStart(2, '0');
    const ss = String(Math.floor(t.start % 60)).padStart(2, '0');
    const editable = !isShared && /^发言人/.test(t.speaker) ? ' editable' : '';
    return `<div class="line"><span class="ts">${mm}:${ss}</span><span class="speaker${editable}" data-speaker="${esc(t.speaker)}" title="${isShared ? '' : '点击改名'}">${esc(t.speaker)}</span>${esc(t.text)}</div>`;
  }).join('');
  document.getElementById('app').className = '';
  document.getElementById('app').innerHTML = `
    <h1>${esc(rec.title)}</h1>
    <div class="meta">${sceneLabel(rec.scene)} · ${Math.max(1, Math.round(rec.duration_sec / 60))} 分钟 · ${rec.segment_count} 段 · ${statusLabel(rec.status)}</div>
    ${rec.doc_url ? `<a class="btn doc-link" href="${rec.doc_url}" target="_blank" rel="noopener">打开飞书文档</a>` : ''}
    ${(!isShared && rec.feishu_status === 'failed') ? `<div class="card"><h2>通知状态</h2><div style="color:#f04438">飞书卡片未发送：应用可能未开启「机器人」能力</div><button id="btnResendCard" class="ghost" style="margin-top:10px">重新发送卡片</button></div>` : ''}
    ${rec.audio_url ? `<audio controls preload="none" src="${rec.audio_url}"></audio>` : ''}
    ${(!isShared && rec.status === 'failed') ? `<div class="card"><h2>处理失败</h2><div style="color:#f87171">${esc(rec.error)}</div><p><button id="btnRetry" style="padding:10px 16px;border:0;border-radius:10px;background:#3b82f6;color:#fff">重新生成</button></p></div>` : ''}
    ${!isShared ? `<div class="card"><div class="row" style="margin-top:0"><button id="btnShare" class="ghost">复制分享链接</button><button id="btnToggleShare" class="ghost">撤销分享</button></div><div class="meta" id="shareState" style="margin-top:8px">链接 30 天有效，可发到飞书群</div></div>` : ''}
    <div class="card"><h2>摘要</h2><div>${esc(s.summary || '（无）')}</div></div>
    ${(s.key_points || []).length ? `<div class="card"><h2>要点</h2><ul>${s.key_points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    ${(s.decisions || []).length ? `<div class="card"><h2>结论 / 决策</h2><ul>${s.decisions.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    ${todo ? `<div class="card"><h2>待办</h2><ul>${todo}</ul></div>` : ''}
    ${(s.risks || []).length ? `<div class="card"><h2>风险</h2><ul>${s.risks.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    <div class="card"><h2>转写全文</h2>${lines || '<div class="empty">暂无转写</div>'}
      ${(!isShared && /发言人/.test(lines)) ? '<div class="hint">点击说话人名字可改名；改完点「重新生成」让纪要也使用新名字。</div>' : ''}
    </div>
  `;
}
let shareState = { revoked: false };
async function loadShareState() {
  try {
    shareState = await fetch('/api/v1/recordings/' + id + '/share', { headers: authHeaders }).then((r) => r.json());
    updateShareUI();
  } catch (e) { /* 忽略 */ }
}
function updateShareUI() {
  const state = document.getElementById('shareState');
  const toggle = document.getElementById('btnToggleShare');
  if (!state || !toggle) return;
  state.textContent = shareState.revoked ? '分享已撤销，当前链接无法打开' : '链接 30 天有效，可发到飞书群';
  state.style.color = shareState.revoked ? '#f04438' : '';
  toggle.textContent = shareState.revoked ? '恢复分享' : '撤销分享';
}

document.addEventListener('click', async (ev) => {
  if (ev.target && ev.target.id === 'btnToggleShare') {
    ev.target.disabled = true;
    try {
      const method = shareState.revoked ? 'DELETE' : 'POST';
      await fetch('/api/v1/recordings/' + id + '/share/revoke', { method, headers: authHeaders });
      await loadShareState();
      toast(shareState.revoked ? '已撤销分享' : '已恢复分享');
    } catch (e) { toast('操作失败'); }
    ev.target.disabled = false;
    return;
  }
  const sp = ev.target;
  if (sp && sp.classList && sp.classList.contains('editable')) {
    const from = sp.getAttribute('data-speaker');
    const current = sp.textContent.trim();
    const modal = document.getElementById('renameModal');
    modal.setAttribute('role', 'dialog'); modal.setAttribute('aria-modal', 'true');
    const input = document.getElementById('renameInput');
    input.value = current;
    modal.style.display = 'grid';
    input.focus();
    const save = async () => {
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      const r = await fetch('/api/v1/recordings/' + id + '/speakers', {
        method: 'PUT',
        headers: { ...authHeaders, 'Content-Type': 'application/json' },
        body: JSON.stringify({ mapping: { [from]: name } }),
      });
      if (r.ok) location.reload(); else toast('改名失败');
    };
    document.getElementById('renameOk').onclick = save;
    document.getElementById('renameCancel').onclick = () => { modal.style.display = 'none'; };
    input.onkeydown = (ev) => { if (ev.key === 'Enter') save(); };
    return;
  }
  if (ev.target && ev.target.id === 'btnResendCard') {
    let r = await fetch('/api/v1/recordings/' + id + '/send', {
      method: 'POST', headers: { ...authHeaders, 'Content-Type': 'application/json' }, body: '{}',
    });
    if (r.status === 400) {  // 飞书通道未启用时改用邮件交付
      r = await fetch('/api/v1/recordings/' + id + '/email', { method: 'POST', headers: authHeaders });
      if (r.ok) { toast('纪要已发送到你的邮箱'); return; }
    }
    if (r.ok) { toast('已重新发送'); location.reload(); } else { toast('发送失败：' + (await r.text())); }
    return;
  }
  if (ev.target && ev.target.id === 'btnShare') {
    if (shareState.revoked) { toast('分享已撤销，请先恢复分享'); return; }
    const r = await fetch('/api/v1/recordings/' + id + '/share', { headers: authHeaders });
    const data = await r.json();
    try {
      await navigator.clipboard.writeText(data.url);
      ev.target.textContent = '已复制 ✓';
    } catch (e) {
      prompt('复制分享链接', data.url);
    }
    return;
  }
  if (ev.target && ev.target.id === 'btnRetry' && !isShared) {
    await fetch('/api/v1/recordings/' + id + '/rerun', { method: 'POST', headers: authHeaders });
    location.reload();
  }
});
const SCENES = { meeting: '内部会议', client: '客户沟通', memo: '语音速记' };
const STATUSES = { created: '草稿', recording: '录音中', queued: '排队中', transcribing: '转写中', transcribed: '转写完成', summarizing: '生成纪要', done: '已完成', failed: '失败' };
function sceneLabel(s) { return SCENES[s] || s; }
function statusLabel(s) { return STATUSES[s] || s; }
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => el.classList.remove('show'), 2200);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
load().then(() => { if (!isShared) loadShareState(); });
</script>
</body>
</html>
