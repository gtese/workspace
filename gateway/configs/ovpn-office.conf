# OpenVPN 服务端（阿里云东京节点）
# 部署路径：/etc/openvpn/server/ovpn-office.conf
# 证书路径按实际 PKI 目录调整；私钥/证书不进仓库

port 443
proto udp
dev tun
topology subnet
server 10.66.66.0 255.255.255.0

ca /etc/openvpn/easy-rsa/pki/ca.crt
cert /etc/openvpn/easy-rsa/pki/issued/server.crt
key /etc/openvpn/easy-rsa/pki/private/server.key
dh /etc/openvpn/easy-rsa/pki/dh.pem

# iKuai 客户端使用客户端证书认证（其“账号认证”实际不发密码）
# 默认 verify-client-cert require，无需 auth-user-pass-verify

data-ciphers AES-256-CBC:AES-128-CBC
data-ciphers-fallback AES-256-CBC
allow-compression yes
comp-lzo adaptive

tun-mtu 1400
mssfix 1360
keepalive 10 60
persist-key
persist-tun

status /var/log/openvpn-status.log
verb 4
log-append /var/log/openvpn.log
tls-version-min 1.2
