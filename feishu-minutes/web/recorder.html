<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Voice</title>
<script defer src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.26.js"></script>
<link rel="stylesheet" href="/static/theme.css">
<style>#result a{color:var(--primary)}</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="brand">
      <span class="chip-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="3" fill="#1f6feb" opacity=".92"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#eaf3ff"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6M6 5l4 4M22 23l4 4M26 5l-4 4M10 23l-4 4" stroke="#4c9aff" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="1.6" fill="#1f6feb"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Trace Voice <span class="badge">AI</span></h1>
        <div class="sub">录音自动转写 · AI 生成会议纪要</div>
      </div>
      <a class="nav" href="/mine">我的纪要 →</a>
    </div>
    <div class="meta" id="who" style="margin-top:10px">正在识别身份…</div>
  </div>
  <div class="card" id="resume" style="display:none"></div>

  <div class="card">
    <label>会议标题</label>
    <input id="title" placeholder="自动生成：日期-时间-人员" value="">
    <div style="margin-top:12px">
      <label>参会人员（可选，逗号分隔）</label>
      <input id="people" placeholder="例如：张三、李四" value="">
    </div>
    <div class="row">
      <div>
        <label>场景</label>
        <select id="scene">
          <option value="meeting">内部会议</option>
          <option value="client">客户沟通</option>
          <option value="memo">语音速记</option>
        </select>
      </div>
      <div id="uidRow">
        <label>员工 open_id（POC）</label>
        <input id="uid" placeholder="demo" value="">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="rec"><span id="dot" class="dot" style="display:none"></span><span id="timer" class="timer">00:00</span></div>
    <div class="level"><i id="levelBar"></i></div>
    <div class="meta" id="hint">手机放桌面中央，录音时请勿锁屏；每 2 分钟自动落一段（最长丢 2 分钟）。</div>
    <div class="row">
      <button id="btnStart">开始录音</button>
      <button id="btnStop" class="danger" disabled>结束并生成纪要</button>
    </div>
    <div class="row"><button id="btnUpload" class="ghost">上传本地音频（m4a / wav 兜底）</button></div>
    <input id="fileInput" type="file" accept="audio/*,.wav" hidden>
    <div class="log" id="status" style="margin-top:12px"></div>
    <div class="row" id="retryBox" style="display:none"><button id="btnRetryUpload" class="danger">重试上传本段</button></div>
  </div>

  <div class="card" id="result" style="display:none"></div>

  <div class="gate" id="gate" style="display:none">
    <div class="gate-card">
      <span class="chip-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="3" fill="#1f6feb" opacity=".92"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#eaf3ff"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="#4c9aff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <h2 id="gateTitle">请在飞书内打开</h2>
      <p id="gateMsg">本应用需要登录飞书账号后使用。</p>
      <button id="btnRelogin">重试登录</button>
    </div>
  </div>
</main>

<script>
const API = '/api/v1';
const MAX_SEG_MS = 2 * 60 * 1000;

const $ = s => document.querySelector(s);
const uid = () => ($('#uid').value.trim() || 'demo');
const savedUid = localStorage.getItem('fm_uid') || '';
if (savedUid && !$('#uid').value) $('#uid').value = savedUid;

/* ---------- 默认标题：日期-时间-人员 ---------- */
let titleTouched = false;
const pad2 = (n) => String(n).padStart(2, '0');
function autoTitle() {
  const d = new Date();
  const date = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const people = ($('#people').value || '').trim() || (S.userName || '').trim();
  return date + '-' + time + (people ? '-' + people : '');
}
$('#title').addEventListener('input', () => { titleTouched = true; });
$('#people').addEventListener('input', () => { if (!titleTouched) $('#title').value = autoTitle(); });
const log = (msg) => { const el = $('#status'); el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; };

/* ---------- WAV 编码 ---------- */
function floatToInt16(f) { const s = Math.max(-1, Math.min(1, f)); return s < 0 ? s * 0x8000 : s * 0x7fff; }

function downsampleTo16k(input, srcRate) {
  if (srcRate === 16000) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) out[i] = floatToInt16(input[i]);
    return out;
  }
  const ratio = srcRate / 16000;
  const n = Math.floor(input.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    out[i] = floatToInt16(end > start ? sum / (end - start) : 0);
  }
  return out;
}

function encodeWav16k(samples) {
  const rate = 16000, bytes = 2, channels = 1;
  const buf = new ArrayBuffer(44 + samples.length * bytes);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * bytes, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, channels, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * channels * bytes, true);
  v.setUint16(32, channels * bytes, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * bytes, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) v.setInt16(o, samples[i], true);
  return new Blob([buf], { type: 'audio/wav' });
}

class WavRecorder {
  constructor() { this.chunks = []; this.samples = 0; this.state = 'idle'; }
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx;
    try { ctx = new AC({ sampleRate: 16000 }); } catch (e) { ctx = new AC(); }
    this.ctx = ctx;
    this.srcRate = ctx.sampleRate;
    this.source = ctx.createMediaStreamSource(this.stream);
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 512;
    this.source.connect(this.analyser);
    this.levelBuf = new Uint8Array(this.analyser.fftSize);
    this.proc = ctx.createScriptProcessor(4096, 1, 1);
    this.gain = ctx.createGain();
    this.gain.gain.value = 0; // 静音，仅保持音频图运行
    this.proc.onaudioprocess = (e) => {
      if (this.state !== 'recording') return;
      const data = e.inputBuffer.getChannelData(0);
      const pcm = downsampleTo16k(data, this.srcRate);
      this.chunks.push(pcm);
      this.samples += pcm.length;
    };
    this.source.connect(this.proc);
    this.proc.connect(this.gain);
    this.gain.connect(ctx.destination);
    this.state = 'recording';
    log('录音中，采样率 ' + this.srcRate + ' → 16k');
  }
  level() {
    if (!this.analyser) return 0;
    this.analyser.getByteTimeDomainData(this.levelBuf);
    let sum = 0;
    for (let i = 0; i < this.levelBuf.length; i++) {
      const v = (this.levelBuf[i] - 128) / 128;
      sum += v * v;
    }
    return Math.min(1, Math.sqrt(sum / this.levelBuf.length) * 4);
  }
  async stop() {
    this.state = 'stopped';
    try {
      this.proc.disconnect(); this.source.disconnect(); this.analyser.disconnect(); this.gain.disconnect();
      this.stream.getTracks().forEach(t => t.stop());
      await this.ctx.close();
    } catch (e) { /* ignore */ }
    const out = new Int16Array(this.samples);
    let o = 0;
    for (const c of this.chunks) { out.set(c, o); o += c.length; }
    this.chunks = [];
    return encodeWav16k(out);
  }
}

/* ---------- 会话状态 ---------- */
const S = { rid: null, segIdx: 0, rec: null, segStart: 0, base: 0, timer: null, running: false, token: '', openId: '', userName: '', mode: 'mock' };

function fmt(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function tick() {
  if (!S.running) return;
  $('#timer').textContent = fmt(S.base + (Date.now() - S.segStart));
  if (S.rec) $('#levelBar').style.width = Math.round(S.rec.level() * 100) + '%';
}

async function api(path, opts = {}) {
  const auth = S.token ? { Authorization: 'Bearer ' + S.token } : {};
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'X-Employee-Open-Id': uid(), ...auth, ...(opts.headers || {}) }
  });
  if (r.status === 401) {
    showGate('需要登录飞书', '请从飞书工作台打开本应用后再使用。');
    throw new Error('未登录');
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function createRecording() {
  return api('/recordings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: $('#title').value.trim() || '未命名会议', scene: $('#scene').value })
  });
}

async function uploadSegment(idx, blob) {
  let lastErr;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const fd = new FormData();
      fd.append('file', blob, 'seg_' + idx + '.wav');
      const r = await fetch(API + '/recordings/' + S.rid + '/segments?idx=' + idx, {
        method: 'POST', body: fd, headers: { 'X-Employee-Open-Id': uid() }
      });
      if (!r.ok) throw new Error(await r.text());
      log('第 ' + (idx + 1) + ' 段已上传（' + (blob.size / 1048576).toFixed(1) + ' MB）');
      return await r.json();
    } catch (e) { lastErr = e; log('第 ' + (idx + 1) + ' 段上传失败（第 ' + attempt + ' 次）：' + e.message); await new Promise(r => setTimeout(r, 1500 * attempt)); }
  }
  throw lastErr;
}

let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 不支持或被拒绝时静默 */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.running && !wakeLock) acquireWakeLock();
});

async function beginSegment() {
  acquireWakeLock();
  S.rec = new WavRecorder();
  await S.rec.start();
  S.segStart = Date.now();
  S.running = true;
  $('#dot').style.display = 'inline-block';
  $('#timer').style.display = '';
  S.timer = setInterval(tick, 500);
  clearTimeout(S.autoTimer);
  S.autoTimer = setTimeout(() => endSegment(true), MAX_SEG_MS);
}

async function endSegment(autoNext) {
  S.running = false;
  if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
  clearTimeout(S.autoTimer);
  clearInterval(S.timer);
  const blob = await S.rec.stop();
  S.base += Date.now() - S.segStart;
  $('#dot').style.display = 'none';
  const idx = S.segIdx++;
  try { await uploadSegment(idx, blob); }
  catch (e) {
    S.pending = { idx, blob };
    S.pendingAutoNext = autoNext;
    $('#retryBox').style.display = 'flex';
    log('本段上传失败（' + e.message + '）。音频还在内存里，点「重试上传本段」即可，不用重录。');
    return;
  }
  if (autoNext) { log('自动进入下一段…'); await beginSegment(); }
}

async function startSession() {
  $('#result').style.display = 'none';
  $('#status').textContent = '';
  if (!titleTouched || !$('#title').value.trim()) $('#title').value = autoTitle();
  const rec = await createRecording();
  S.rid = rec.id; S.segIdx = 0; S.base = 0;
  localStorage.setItem('fm_rid', rec.id);
  log('已创建录音会话：' + rec.id);
  $('#btnStart').disabled = true; $('#btnStop').disabled = false;
  await beginSegment();
}

async function finishSession() {
  $('#btnStop').disabled = true;
  log('上传完成，开始转写与生成纪要…');
  await api('/recordings/' + S.rid + '/finish', { method: 'POST' });
  localStorage.removeItem('fm_rid');
  poll();
}

async function poll() {
  const rec = await api('/recordings/' + S.rid);
  log('状态：' + rec.status);
  if (rec.status === 'done') {
    $('#result').style.display = 'block';
    const s = rec.summary || {};
    $('#result').innerHTML = '<h1>' + rec.title + '</h1>' +
      '<div class="meta">时长 ' + rec.duration_sec + ' 秒 · ' + rec.segment_count + ' 段</div>' +
      '<p>' + (s.summary || '') + '</p>' +
      '<p><a href="/d/' + rec.id + '">查看完整纪要 / 播放录音</a></p>';
    $('#btnStart').disabled = false;
    return;
  }
  if (rec.status === 'failed') {
    log('处理失败：' + rec.error);
    $('#result').style.display = 'block';
    $('#result').innerHTML = '<h1>处理失败</h1><p class="meta">' + rec.error + '</p>' +
      '<div class="row"><button id="btnRetry">重新生成</button></div>';
    document.getElementById('btnRetry').onclick = async () => {
      $('#result').innerHTML = '<div class="meta">已重新排队…</div>';
      await api('/recordings/' + S.rid + '/rerun', { method: 'POST' });
      poll();
    };
    $('#btnStart').disabled = false;
    return;
  }
  setTimeout(poll, 2000);
}

/* ---------- 事件 ---------- */
$('#btnStart').onclick = async () => {
  try { await startSession(); }
  catch (e) {
    const name = e && e.name || '';
    const hint = name === 'NotAllowedError' ? '麦克风权限被拒绝：请在浏览器/飞书设置里允许麦克风后刷新页面。'
      : name === 'NotFoundError' ? '没有找到麦克风设备。'
      : name === 'NotReadableError' ? '麦克风被其他应用占用，关掉录音类应用后重试。'
      : e.message;
    log('启动失败：' + hint);
    $('#btnStart').disabled = false;
  }
};

$('#btnStop').onclick = async () => {
  $('#btnStop').disabled = true;
  if (S.running) await endSegment(false);
  await finishSession();
};

$('#btnRetryUpload').onclick = async () => {
  if (!S.pending) return;
  const { idx, blob } = S.pending;
  $('#btnRetryUpload').disabled = true;
  try {
    await uploadSegment(idx, blob);
    S.pending = null;
    $('#retryBox').style.display = 'none';
    if (S.pendingAutoNext) { await beginSegment(); }
    else { await finishSession(); }
  } catch (e) {
    log('仍然失败：' + e.message);
  } finally {
    $('#btnRetryUpload').disabled = false;
  }
};

$('#btnUpload').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const rec = await createRecording();
    S.rid = rec.id; S.segIdx = 0;
    log('已创建会话：' + rec.id + '，上传文件 ' + f.name);
    await uploadSegment(0, f);
    await finishSession();
  } catch (err) { log('上传失败：' + err.message); }
  e.target.value = '';
};

/* ---------- 断点续录 ---------- */
function escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function checkResume() {
  const rid = localStorage.getItem('fm_rid');
  if (!rid) return;
  try {
    const rec = await api('/recordings/' + rid);
    if (rec.status === 'recording' && rec.segment_count > 0) {
      const box = $('#resume');
      box.style.display = 'block';
      box.innerHTML = '<div class="meta">上次有一段未完成的录音</div>' +
        '<div style="font-weight:600;margin:4px 0 10px">' + escHtml(rec.title) + ' · 已上传 ' + rec.segment_count + ' 段</div>' +
        '<div class="row"><button id="btnResume">继续录音</button>' +
        '<button id="btnIgnore" class="ghost">忽略</button></div>';
      document.getElementById('btnResume').onclick = () => {
        box.style.display = 'none';
        startResume(rec);
      };
      document.getElementById('btnIgnore').onclick = () => {
        localStorage.removeItem('fm_rid');
        box.style.display = 'none';
      };
    } else {
      localStorage.removeItem('fm_rid');
    }
  } catch (e) {
    localStorage.removeItem('fm_rid');
  }
}

async function startResume(rec) {
  S.rid = rec.id;
  S.segIdx = rec.next_segment_index || rec.segment_count || 0;
  S.base = 0;
  $('#result').style.display = 'none';
  $('#status').textContent = '';
  $('#btnStart').disabled = true;
  $('#btnStop').disabled = false;
  log('继续录音：' + rec.id + '，从第 ' + (S.segIdx + 1) + ' 段开始');
  await beginSegment();
}

/* ---------- 飞书免登（网页应用内） ---------- */
const LOGIN_SCRIPT_FLAG = 'fm_login_done';

function showGate(title, msg) {
  $('#gate').style.display = 'grid';
  $('#gateTitle').textContent = title;
  $('#gateMsg').textContent = msg;
  document.body.classList.add('locked');
}
function hideGate() {
  $('#gate').style.display = 'none';
  document.body.classList.remove('locked');
}

async function fetchConfig() {
  try { return await fetch(API + '/feishu/app-id').then(r => r.json()); }
  catch (e) { return { app_id: '', mode: 'mock' }; }
}

async function attemptFeishuLogin(appId) {
  if (!window.h5sdk || !window.tt) throw new Error('NOT_IN_FEISHU');
  const code = await new Promise((resolve, reject) => {
    window.h5sdk.error(err => console.warn('h5sdk error', err));
    window.h5sdk.ready(() => {
      const ok = (res) => resolve(res.code);
      const fail = (err) => reject(new Error('AUTH_FAIL:' + JSON.stringify(err)));
      if (window.tt.requestAccess) {
        window.tt.requestAccess({ appID: appId, scopeList: [], success: ok, fail });
      } else if (window.tt.requestAuthCode) {
        window.tt.requestAuthCode({ appId: appId, success: ok, fail });
      } else {
        reject(new Error('NO_AUTH_API'));
      }
    });
  });
  const r = await fetch(API + '/auth/feishu-login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || 'LOGIN_FAILED');
  S.token = data.token; S.openId = data.open_id;
  $('#uid').value = data.open_id;
  localStorage.setItem('fm_uid', data.open_id);
  localStorage.setItem('fm_token', data.token);
  return data;
}

async function ensureLogin() {
  const cfg = await fetchConfig();
  S.mode = cfg.mode || 'mock';
  if (S.mode !== 'real') {
    $('#uidRow').style.display = '';
    if (!$('#uid').value) $('#uid').value = localStorage.getItem('fm_uid') || 'demo';
    $('#who').textContent = '开发模式 · 模拟身份 ' + uid();
    if (!titleTouched) $('#title').value = autoTitle();
    hideGate();
    return;
  }
  $('#uidRow').style.display = 'none';
  if (!cfg.app_id) { showGate('应用未配置', '服务器尚未配置飞书 App ID，请联系管理员。'); return; }
  if (!window.h5sdk || !window.tt) {
    showGate('请在飞书客户端中打开', '本应用需要飞书登录，请从飞书工作台进入「纪要录音」。');
    return;
  }
  try {
    const data = await attemptFeishuLogin(cfg.app_id);
    $('#who').textContent = '已登录：' + (data.name || data.open_id);
    hideGate();
  } catch (e) {
    console.warn('飞书登录失败', e);
    const msg = String((e && e.message) || e);
    if (msg === 'NOT_IN_FEISHU') {
      showGate('请在飞书客户端中打开', '本应用需要飞书登录，请从飞书工作台进入「纪要录音」。');
    } else {
      showGate('登录失败', '请重新在飞书内打开；若持续失败，请检查应用的重定向 URL 配置。');
    }
  }
}

$('#btnRelogin').onclick = () => ensureLogin();

window.addEventListener('load', () => { if (!$('#title').value) $('#title').value = autoTitle(); ensureLogin(); checkResume(); });
</script>
</body>
</html>
