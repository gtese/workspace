<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纪要录音 · POC</title>
<script defer src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.26.js"></script>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e8ecf3; --muted:#8b94a7; --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 56px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 6px; }
  input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0d0f14; color:var(--text); font-size:15px; }
  .row { display:flex; gap:10px; margin-top:12px; }
  .row > div { flex:1; }
  button { border:0; border-radius:12px; padding:13px 18px; font-size:15px; font-weight:600; color:#fff; background:var(--accent); width:100%; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.45; }
  .rec { display:flex; align-items:center; gap:10px; margin:14px 0 6px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--danger); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .timer { font-variant-numeric:tabular-nums; font-size:30px; font-weight:700; letter-spacing:1px; }
  .meta { color:var(--muted); font-size:12px; }
  .log { font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); white-space:pre-wrap; max-height:180px; overflow:auto; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; border:1px solid var(--line); color:var(--muted); margin-right:6px; }
  .pill.ok { color:var(--ok); border-color:#1f5133; }
  .pill.bad { color:var(--danger); border-color:#5a2222; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  #result a { color:#93c5fd; }
</style>
</head>
<body>
<main>
  <h1>纪要录音 · POC</h1>
  <div class="sub">录音 → 分段上传 → 转写 → 纪要。当前为 mock ASR/LLM 链路，用于验证录音通路。</div>
  <div class="meta" id="who" style="margin:-10px 0 14px">未登录（POC 用 open_id 模拟）</div>

  <div class="card">
    <label>会议标题</label>
    <input id="title" placeholder="例如：客户 A 需求沟通" value="">
    <div class="row">
      <div>
        <label>场景</label>
        <select id="scene">
          <option value="meeting">内部会议</option>
          <option value="client">客户沟通</option>
          <option value="memo">语音速记</option>
        </select>
      </div>
      <div>
        <label>员工 open_id（POC）</label>
        <input id="uid" placeholder="demo" value="demo">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="rec"><span id="dot" class="dot" style="display:none"></span><span id="timer" class="timer">00:00</span></div>
    <div class="meta" id="hint">手机放桌面中央，录音时请勿锁屏；每 9 分钟自动落一段。</div>
    <div class="row">
      <button id="btnStart">开始录音</button>
      <button id="btnStop" class="danger" disabled>结束并生成纪要</button>
    </div>
    <div class="row"><button id="btnUpload" class="ghost">上传本地音频（.wav 兜底）</button></div>
    <input id="fileInput" type="file" accept="audio/*,.wav" hidden>
    <div class="log" id="status" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <details>
      <summary>环境自检（真机测试时展开）</summary>
      <div class="log" id="diag"></div>
    </details>
  </div>

  <div class="card" id="result" style="display:none"></div>
</main>

<script>
const API = '/api/v1';
const MAX_SEG_MS = 9 * 60 * 1000;

const $ = s => document.querySelector(s);
const uid = () => ($('#uid').value.trim() || 'demo');
const log = (msg) => { const el = $('#status'); el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; };

/* ---------- 诊断 ---------- */
(function diag() {
  const AC = window.AudioContext || window.webkitAudioContext;
  const lines = [
    'UA: ' + navigator.userAgent,
    'secureContext: ' + window.isSecureContext,
    'mediaDevices: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    'AudioContext: ' + !!AC,
    'AudioWorklet: ' + !!(AC && AC.prototype && 'audioWorklet' in AC.prototype),
    'ScriptProcessor: ' + !!(AC && AC.prototype && 'createScriptProcessor' in AC.prototype),
    'tt (飞书 JSAPI): ' + (typeof window.tt !== 'undefined'),
    'tt.getRecorderManager: ' + !!(window.tt && window.tt.getRecorderManager),
  ];
  $('#diag').textContent = lines.join('\n');
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    $('#hint').textContent = '当前环境不支持 getUserMedia，请用「上传本地音频」兜底，或换成手机浏览器/飞书网页应用环境。';
  }
})();

/* ---------- WAV 编码 ---------- */
function floatToInt16(f) { const s = Math.max(-1, Math.min(1, f)); return s < 0 ? s * 0x8000 : s * 0x7fff; }

function downsampleTo16k(input, srcRate) {
  if (srcRate === 16000) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) out[i] = floatToInt16(input[i]);
    return out;
  }
  const ratio = srcRate / 16000;
  const n = Math.floor(input.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    out[i] = floatToInt16(end > start ? sum / (end - start) : 0);
  }
  return out;
}

function encodeWav16k(samples) {
  const rate = 16000, bytes = 2, channels = 1;
  const buf = new ArrayBuffer(44 + samples.length * bytes);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * bytes, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, channels, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * channels * bytes, true);
  v.setUint16(32, channels * bytes, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * bytes, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) v.setInt16(o, samples[i], true);
  return new Blob([buf], { type: 'audio/wav' });
}

class WavRecorder {
  constructor() { this.chunks = []; this.samples = 0; this.state = 'idle'; }
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx;
    try { ctx = new AC({ sampleRate: 16000 }); } catch (e) { ctx = new AC(); }
    this.ctx = ctx;
    this.srcRate = ctx.sampleRate;
    this.source = ctx.createMediaStreamSource(this.stream);
    this.proc = ctx.createScriptProcessor(4096, 1, 1);
    this.gain = ctx.createGain();
    this.gain.gain.value = 0; // 静音，仅保持音频图运行
    this.proc.onaudioprocess = (e) => {
      if (this.state !== 'recording') return;
      const data = e.inputBuffer.getChannelData(0);
      const pcm = downsampleTo16k(data, this.srcRate);
      this.chunks.push(pcm);
      this.samples += pcm.length;
    };
    this.source.connect(this.proc);
    this.proc.connect(this.gain);
    this.gain.connect(ctx.destination);
    this.state = 'recording';
    log('录音中，采样率 ' + this.srcRate + ' → 16k');
  }
  async stop() {
    this.state = 'stopped';
    try {
      this.proc.disconnect(); this.source.disconnect(); this.gain.disconnect();
      this.stream.getTracks().forEach(t => t.stop());
      await this.ctx.close();
    } catch (e) { /* ignore */ }
    const out = new Int16Array(this.samples);
    let o = 0;
    for (const c of this.chunks) { out.set(c, o); o += c.length; }
    this.chunks = [];
    return encodeWav16k(out);
  }
}

/* ---------- 会话状态 ---------- */
const S = { rid: null, segIdx: 0, rec: null, segStart: 0, base: 0, timer: null, running: false, token: '', openId: '' };

function fmt(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function tick() {
  if (!S.running) return;
  $('#timer').textContent = fmt(S.base + (Date.now() - S.segStart));
}

async function api(path, opts = {}) {
  const auth = S.token ? { Authorization: 'Bearer ' + S.token } : {};
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'X-Employee-Open-Id': uid(), ...auth, ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function createRecording() {
  return api('/recordings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: $('#title').value.trim() || '未命名会议', scene: $('#scene').value })
  });
}

async function uploadSegment(idx, blob) {
  let lastErr;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const fd = new FormData();
      fd.append('file', blob, 'seg_' + idx + '.wav');
      const r = await fetch(API + '/recordings/' + S.rid + '/segments?idx=' + idx, {
        method: 'POST', body: fd, headers: { 'X-Employee-Open-Id': uid() }
      });
      if (!r.ok) throw new Error(await r.text());
      log('第 ' + (idx + 1) + ' 段已上传（' + (blob.size / 1048576).toFixed(1) + ' MB）');
      return await r.json();
    } catch (e) { lastErr = e; log('第 ' + (idx + 1) + ' 段上传失败（第 ' + attempt + ' 次）：' + e.message); await new Promise(r => setTimeout(r, 1500 * attempt)); }
  }
  throw lastErr;
}

async function beginSegment() {
  S.rec = new WavRecorder();
  await S.rec.start();
  S.segStart = Date.now();
  S.running = true;
  $('#dot').style.display = 'inline-block';
  $('#timer').style.display = '';
  S.timer = setInterval(tick, 500);
  clearTimeout(S.autoTimer);
  S.autoTimer = setTimeout(() => endSegment(true), MAX_SEG_MS);
}

async function endSegment(autoNext) {
  S.running = false;
  clearTimeout(S.autoTimer);
  clearInterval(S.timer);
  const blob = await S.rec.stop();
  S.base += Date.now() - S.segStart;
  $('#dot').style.display = 'none';
  const idx = S.segIdx++;
  try { await uploadSegment(idx, blob); }
  catch (e) { log('分段上传最终失败：' + e.message + '，请重新录音或稍后重试。'); S.running = false; return; }
  if (autoNext) { log('自动进入下一段…'); await beginSegment(); }
}

async function startSession() {
  $('#result').style.display = 'none';
  $('#status').textContent = '';
  const rec = await createRecording();
  S.rid = rec.id; S.segIdx = 0; S.base = 0;
  log('已创建录音会话：' + rec.id);
  $('#btnStart').disabled = true; $('#btnStop').disabled = false;
  await beginSegment();
}

async function finishSession() {
  $('#btnStop').disabled = true;
  log('上传完成，开始转写与生成纪要…');
  await api('/recordings/' + S.rid + '/finish', { method: 'POST' });
  poll();
}

async function poll() {
  const rec = await api('/recordings/' + S.rid);
  log('状态：' + rec.status);
  if (rec.status === 'done') {
    $('#result').style.display = 'block';
    const s = rec.summary || {};
    $('#result').innerHTML = '<h1>' + rec.title + '</h1>' +
      '<div class="meta">时长 ' + rec.duration_sec + ' 秒 · ' + rec.segment_count + ' 段</div>' +
      '<p>' + (s.summary || '') + '</p>' +
      '<p><a href="/d/' + rec.id + '">查看完整纪要 / 播放录音</a></p>';
    $('#btnStart').disabled = false;
    return;
  }
  if (rec.status === 'failed') {
    log('处理失败：' + rec.error);
    $('#btnStart').disabled = false;
    return;
  }
  setTimeout(poll, 2000);
}

/* ---------- 事件 ---------- */
$('#btnStart').onclick = async () => {
  try { await startSession(); }
  catch (e) { log('启动失败：' + e.message); $('#btnStart').disabled = false; }
};

$('#btnStop').onclick = async () => {
  $('#btnStop').disabled = true;
  if (S.running) await endSegment(false);
  await finishSession();
};

$('#btnUpload').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const rec = await createRecording();
    S.rid = rec.id; S.segIdx = 0;
    log('已创建会话：' + rec.id + '，上传文件 ' + f.name);
    await uploadSegment(0, f);
    await finishSession();
  } catch (err) { log('上传失败：' + err.message); }
  e.target.value = '';
};

/* ---------- 飞书免登（网页应用内） ---------- */
async function ensureLogin() {
  try {
    const cfg = await fetch(API + '/feishu/app-id').then(r => r.json());
    if (!cfg.app_id) {
      $('#who').textContent = '未配置飞书应用，模拟身份：' + uid();
      return;
    }
    if (!window.h5sdk || !window.tt) {
      $('#who').textContent = '非飞书环境，模拟身份：' + uid();
      return;
    }
    const code = await new Promise((resolve, reject) => {
      window.h5sdk.error(err => console.warn('h5sdk error', err));
      window.h5sdk.ready(() => {
        const ok = (res) => resolve(res.code);
        const fail = (err) => reject(new Error(JSON.stringify(err)));
        if (window.tt.requestAccess) {
          window.tt.requestAccess({ appID: cfg.app_id, scopeList: [], success: ok, fail });
        } else if (window.tt.requestAuthCode) {
          window.tt.requestAuthCode({ appId: cfg.app_id, success: ok, fail });
        } else {
          reject(new Error('客户端不支持 requestAccess'));
        }
      });
    });
    const r = await fetch(API + '/auth/feishu-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || '登录失败');
    S.token = data.token; S.openId = data.open_id;
    localStorage.setItem('fm_uid', data.open_id);
    localStorage.setItem('fm_token', data.token);
    $('#who').textContent = '已登录：' + (data.name || data.open_id) + (data.mock ? '（mock）' : '');
  } catch (e) {
    console.warn('飞书登录失败', e);
    $('#who').textContent = '登录失败，模拟身份：' + uid();
  }
}
window.addEventListener('load', ensureLogin);
</script>
</body>
</html>
