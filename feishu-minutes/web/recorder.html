<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Voice</title>
<script defer src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.26.js"></script>
<link rel="stylesheet" href="/static/theme.css">
<style>#result a{color:var(--primary)}</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="brand">
      <span class="chip-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="3" fill="#1f6feb" opacity=".92"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#eaf3ff"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6M6 5l4 4M22 23l4 4M26 5l-4 4M10 23l-4 4" stroke="#4c9aff" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="1.6" fill="#1f6feb"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Trace Voice <span class="badge">AI</span></h1>
        <div class="sub">录音自动转写 · AI 生成会议纪要</div>
      </div>
      <a class="nav" href="#records">录音记录 →</a>
    </div>
    <div class="meta" id="who" style="margin-top:10px">正在识别身份…</div>
  </div>
  <div class="card" id="resume" style="display:none"></div>

  <div class="card" id="recCard">
    <div class="rec"><span id="dot" class="dot" style="display:none"></span><span id="timer" class="timer">00:00</span></div>
    <div class="level"><i id="levelBar"></i></div>
    <div class="meta" id="hint">手机放桌面中央，录音时请勿锁屏；每 2 分钟自动落一段（最长丢 2 分钟）。</div>
    <div class="row">
      <button id="btnStart">开始录音</button>
      <button id="btnStop" class="danger" disabled>结束并生成纪要</button>
    </div>
    <div class="log" id="status" style="margin-top:12px"></div>
    <div class="row" id="retryBox" style="display:none"><button id="btnRetryUpload" class="danger">重试上传本段</button></div>
  </div>

  <div class="card">
    <label>会议标题</label>
    <input id="title" placeholder="自动生成：日期-时间-人员" value="">
    <div style="margin-top:12px">
      <label>参会人员（可选，逗号分隔）</label>
      <input id="people" placeholder="例如：张三、李四" value="">
    </div>
    <div class="row">
      <div>
        <label>场景</label>
        <select id="scene">
          <option value="meeting">内部会议</option>
          <option value="client">客户沟通</option>
          <option value="memo">语音速记</option>
        </select>
      </div>
      <div id="uidRow">
        <label>员工 open_id（POC）</label>
        <input id="uid" placeholder="demo" value="">
      </div>
    </div>
  </div>

  <div class="card" id="records">
    <div class="top"><h2 style="margin:0">录音记录</h2><span class="meta" id="recCount"></span></div>
    <div class="row" style="margin-top:10px;gap:8px">
      <select id="recRange" style="max-width:150px">
        <option value="all">全部时间</option>
        <option value="today">今天</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
      </select>
      <input id="recSearch" placeholder="按标题搜索">
    </div>
    <div id="recList" style="margin-top:12px"></div>
  </div>

  <div class="card" id="result" style="display:none"></div>

  <div class="gate" id="gate" style="display:none">
    <div class="gate-card">
      <span class="chip-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="3" fill="#1f6feb" opacity=".92"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#eaf3ff"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="#4c9aff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <h2 id="gateTitle">请在飞书内打开</h2>
      <p id="gateMsg">本应用需要登录飞书账号后使用。</p>
      <button id="btnRelogin">登录飞书</button>
    </div>
  </div>
</main>

<script>
const API = '/api/v1';
const SEG_MS = 2 * 60 * 1000;

const $ = (s) => document.querySelector(s);
const uid = () => (($('#uid') && $('#uid').value.trim()) || localStorage.getItem('fm_uid') || 'demo');
const savedUid = localStorage.getItem('fm_uid') || '';
if (savedUid && $('#uid') && !$('#uid').value) $('#uid').value = savedUid;

const state = {
  rid: null, idx: 0, rec: null, running: false, startedAt: 0,
  tick: null, rotate: null, token: '', openId: '', userName: '',
  mode: 'mock', pending: [], pumping: false, finishing: false, reloginTriedAt: 0,
};
state.token = localStorage.getItem('fm_token') || '';

/* ---------- 基础 ---------- */
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function log(msg) {
  const el = $('#status');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function fmt(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* ---------- 默认标题：日期-时间-人员 ---------- */
let titleTouched = false;
const pad2 = (n) => String(n).padStart(2, '0');
function autoTitle() {
  const d = new Date();
  const date = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const people = ($('#people').value || '').trim() || (state.userName || '').trim();
  return date + '-' + time + (people ? '-' + people : '');
}
$('#title').addEventListener('input', () => { titleTouched = true; });
$('#people').addEventListener('input', () => { if (!titleTouched) $('#title').value = autoTitle(); });

/* ---------- 登录 ---------- */
function showGate(title, msg) {
  $('#gate').style.display = 'grid';
  $('#gateTitle').textContent = title;
  $('#gateMsg').textContent = msg;
  document.body.classList.add('locked');
}
function hideGate() {
  $('#gate').style.display = 'none';
  document.body.classList.remove('locked');
}
async function fetchConfig() {
  try { return await fetch(API + '/feishu/app-id').then((r) => r.json()); }
  catch (e) { return { app_id: '', mode: 'mock' }; }
}
async function attemptFeishuLogin(appId) {
  if (!window.h5sdk || !window.tt) throw new Error('NOT_IN_FEISHU');
  const code = await new Promise((resolve, reject) => {
    window.h5sdk.error((err) => console.warn('h5sdk error', err));
    window.h5sdk.ready(() => {
      const ok = (res) => resolve(res.code);
      const fail = (err) => reject(new Error('AUTH_FAIL:' + JSON.stringify(err)));
      if (window.tt.requestAccess) window.tt.requestAccess({ appID: appId, scopeList: [], success: ok, fail });
      else if (window.tt.requestAuthCode) window.tt.requestAuthCode({ appId: appId, success: ok, fail });
      else reject(new Error('NO_AUTH_API'));
    });
  });
  const r = await fetch(API + '/auth/feishu-login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || 'LOGIN_FAILED');
  return data;
}
function applyLogin(data) {
  state.token = data.token;
  state.openId = data.open_id;
  state.userName = data.name || '';
  if ($('#uid')) $('#uid').value = data.open_id;
  localStorage.setItem('fm_uid', data.open_id);
  localStorage.setItem('fm_token', data.token);
  $('#who').textContent = '已登录：' + (data.name || data.open_id);
  if (!titleTouched) $('#title').value = autoTitle();
  hideGate();
}
async function ensureLogin() {
  const cfg = await fetchConfig();
  state.mode = cfg.mode || 'mock';
  if (state.mode !== 'real') {
    $('#uidRow').style.display = '';
    if (!$('#uid').value) $('#uid').value = localStorage.getItem('fm_uid') || 'demo';
    $('#who').textContent = '开发模式 · 模拟身份 ' + uid();
    hideGate();
    loadRecords();
    return true;
  }
  $('#uidRow').style.display = 'none';
  if (!cfg.app_id) { showGate('应用未配置', '服务器尚未配置飞书 App ID，请联系管理员。'); return false; }
  if (!window.h5sdk || !window.tt) {
    showGate('请在飞书客户端中打开', '本应用需要飞书登录，请从飞书工作台进入「Trace Voice」。');
    return false;
  }
  try {
    applyLogin(await attemptFeishuLogin(cfg.app_id));
    loadRecords();
    return true;
  } catch (e) {
    console.warn('飞书登录失败', e);
    showGate('需要登录飞书', '点击下方按钮登录；登录后录音会自动继续上传。');
    return false;
  }
}
async function quickRelogin() {
  const now = Date.now();
  if (state.mode !== 'real') return false;
  if (now - state.reloginTriedAt < 5000) return false;
  state.reloginTriedAt = now;
  try {
    const cfg = await fetchConfig();
    if (!cfg.app_id) return false;
    applyLogin(await attemptFeishuLogin(cfg.app_id));
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------- API ---------- */
async function rawApi(path, opts = {}) {
  const auth = state.token ? { Authorization: 'Bearer ' + state.token } : {};
  return fetch(API + path, {
    ...opts,
    headers: { 'X-Employee-Open-Id': uid(), ...auth, ...(opts.headers || {}) },
  });
}
async function api(path, opts = {}, retried = false) {
  const r = await rawApi(path, opts);
  if (r.status === 401) {
    if (!retried && (await quickRelogin())) return api(path, opts, true);
    showGate('需要登录飞书', '登录状态已失效，点下方按钮重新登录；录音会继续，恢复后自动上传。');
    throw new Error('未登录');
  }
  if (r.status === 204) return null;
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------- 录音（一次授权，分段转存） ---------- */
function floatToInt16(f) { const s = Math.max(-1, Math.min(1, f)); return s < 0 ? s * 0x8000 : s * 0x7fff; }
function downsampleTo16k(input, srcRate) {
  if (srcRate === 16000) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) out[i] = floatToInt16(input[i]);
    return out;
  }
  const ratio = srcRate / 16000;
  const n = Math.floor(input.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const start = Math.floor(i * ratio), end = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    out[i] = floatToInt16(end > start ? sum / (end - start) : 0);
  }
  return out;
}
function encodeWav16k(samples) {
  const rate = 16000, bytes = 2, channels = 1;
  const buf = new ArrayBuffer(44 + samples.length * bytes);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * bytes, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, channels, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * channels * bytes, true);
  v.setUint16(32, channels * bytes, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * bytes, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) v.setInt16(o, samples[i], true);
  return new Blob([buf], { type: 'audio/wav' });
}

class WavRecorder {
  constructor() { this.chunks = []; this.samples = 0; this.state = 'idle'; }
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx;
    try { ctx = new AC({ sampleRate: 16000 }); } catch (e) { ctx = new AC(); }
    this.ctx = ctx;
    this.srcRate = ctx.sampleRate;
    this.source = ctx.createMediaStreamSource(this.stream);
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 512;
    this.source.connect(this.analyser);
    this.levelBuf = new Uint8Array(this.analyser.fftSize);
    this.proc = ctx.createScriptProcessor(4096, 1, 1);
    this.gain = ctx.createGain();
    this.gain.gain.value = 0;
    this.proc.onaudioprocess = (e) => {
      if (this.state !== 'recording') return;
      const pcm = downsampleTo16k(e.inputBuffer.getChannelData(0), this.srcRate);
      this.chunks.push(pcm);
      this.samples += pcm.length;
    };
    this.source.connect(this.proc);
    this.proc.connect(this.gain);
    this.gain.connect(ctx.destination);
    this.state = 'recording';
    log('录音中（麦克风只申请一次，后续分段不再重复弹窗）');
  }
  level() {
    if (!this.analyser) return 0;
    this.analyser.getByteTimeDomainData(this.levelBuf);
    let sum = 0;
    for (let i = 0; i < this.levelBuf.length; i++) { const v = (this.levelBuf[i] - 128) / 128; sum += v * v; }
    return Math.min(1, Math.sqrt(sum / this.levelBuf.length) * 4);
  }
  flush() {
    if (!this.samples) return null;
    const out = new Int16Array(this.samples);
    let o = 0;
    for (const c of this.chunks) { out.set(c, o); o += c.length; }
    this.chunks = []; this.samples = 0;
    return encodeWav16k(out);
  }
  async stop() {
    this.state = 'stopped';
    try {
      this.proc.disconnect(); this.source.disconnect(); this.analyser.disconnect(); this.gain.disconnect();
      this.stream.getTracks().forEach((t) => t.stop());
      await this.ctx.close();
    } catch (e) { /* ignore */ }
  }
}

/* ---------- 上传队列（弱网优先录音） ---------- */
function queueHint() {
  if (!state.pending.length) return;
  $('#hint').textContent = '有 ' + state.pending.length + ' 段待上传，录音继续；网络恢复后自动补齐。';
}
async function waitOnline() {
  if (navigator.onLine) return;
  log('网络已断开，继续录音，恢复后自动上传…');
  await new Promise((resolve) => {
    const h = () => { window.removeEventListener('online', h); resolve(); };
    window.addEventListener('online', h);
  });
  log('网络已恢复，继续上传…');
}
function enqueue(idx, blob) {
  if (!blob || blob.size < 1000) return;
  state.pending.push({ idx, blob, attempts: 0 });
  queueHint();
  pump();
}
async function pump() {
  if (state.pumping || !state.rid) return;
  state.pumping = true;
  try {
    while (state.pending.length) {
      const item = state.pending[0];
      try {
        const fd = new FormData();
        fd.append('file', item.blob, 'seg_' + item.idx + '.wav');
        const r = await rawApi('/recordings/' + state.rid + '/segments?idx=' + item.idx, { method: 'POST', body: fd });
        if (r.status === 401) {
          if (await quickRelogin()) continue;
          showGate('需要登录飞书', '登录状态已失效，点下方按钮重新登录；录音会继续，恢复后自动上传。');
          break;
        }
        if (!r.ok) throw new Error(await r.text());
        state.pending.shift();
        log('第 ' + (item.idx + 1) + ' 段已上传');
        queueHint();
      } catch (e) {
        item.attempts += 1;
        log('第 ' + (item.idx + 1) + ' 段上传失败（第 ' + item.attempts + ' 次），录音继续，稍后自动重试');
        await waitOnline();
        await sleep(Math.min(15000, 2000 * item.attempts));
      }
    }
  } finally {
    state.pumping = false;
    if (!state.pending.length) $('#hint').textContent = '手机放桌面中央，录音时请勿锁屏；每 2 分钟自动保存一段。';
  }
  if (state.finishing && !state.pending.length) await doFinish();
}

/* ---------- 会话 ---------- */
async function createRecording() {
  return api('/recordings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: $('#title').value.trim() || autoTitle(), scene: $('#scene').value }),
  });
}
function tick() {
  if (!state.running) return;
  $('#timer').textContent = fmt(Date.now() - state.startedAt);
  if (state.rec) $('#levelBar').style.width = Math.round(state.rec.level() * 100) + '%';
}
function rotateSegment() {
  if (!state.running || !state.rec) return;
  const blob = state.rec.flush();
  enqueue(state.idx++, blob);
  state.rotate = setTimeout(rotateSegment, SEG_MS);
}
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 忽略 */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.running && !wakeLock) acquireWakeLock();
});

async function startSession() {
  $('#result').style.display = 'none';
  $('#status').textContent = '';
  if (!titleTouched || !$('#title').value.trim()) $('#title').value = autoTitle();
  const rec = await createRecording();
  state.rid = rec.id; state.idx = 0; state.pending = []; state.finishing = false;
  localStorage.setItem('fm_rid', rec.id);
  log('已创建录音会话：' + rec.id);
  $('#btnStart').disabled = true;
  $('#btnStop').disabled = false;
  state.rec = new WavRecorder();
  await state.rec.start();
  acquireWakeLock();
  state.running = true;
  state.startedAt = Date.now();
  $('#dot').style.display = 'inline-block';
  state.tick = setInterval(tick, 500);
  state.rotate = setTimeout(rotateSegment, SEG_MS);
}

async function stopSession() {
  state.running = false;
  clearTimeout(state.rotate);
  clearInterval(state.tick);
  if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
  $('#dot').style.display = 'none';
  $('#btnStop').disabled = true;
  const blob = state.rec.flush();
  enqueue(state.idx++, blob);
  await state.rec.stop();
  log('录音结束，处理中…');
  state.finishing = true;
  if (!state.pending.length) await doFinish();
  else log('等待 ' + state.pending.length + ' 段上传完成后自动生成纪要…');
}

async function doFinish() {
  state.finishing = false;
  try {
    await api('/recordings/' + state.rid + '/finish', { method: 'POST' });
    localStorage.removeItem('fm_rid');
    poll();
  } catch (e) {
    log('提交失败：' + e.message);
    state.finishing = true;
  }
}

async function poll() {
  const rec = await api('/recordings/' + state.rid);
  log('状态：' + rec.status);
  if (rec.status === 'done') {
    $('#result').style.display = 'block';
    const s = rec.summary || {};
    const docBtn = rec.doc_url ? '<p><a href="' + rec.doc_url + '" target="_blank">打开飞书文档</a></p>' : '';
    $('#result').innerHTML = '<h1>' + escHtml(rec.title) + '</h1>' +
      '<div class="meta">时长 ' + rec.duration_sec + ' 秒 · ' + rec.segment_count + ' 段</div>' +
      '<p>' + escHtml(s.summary || '') + '</p>' + docBtn +
      '<p><a href="/d/' + rec.id + '">查看完整纪要 / 播放录音</a></p>';
    $('#btnStart').disabled = false;
    loadRecords();
    return;
  }
  if (rec.status === 'failed') {
    $('#result').style.display = 'block';
    $('#result').innerHTML = '<h1>处理失败</h1><p class="meta">' + escHtml(rec.error) + '</p>' +
      '<div class="row"><button id="btnRetry">重新生成</button></div>';
    document.getElementById('btnRetry').onclick = async () => {
      $('#result').innerHTML = '<div class="meta">已重新排队…</div>';
      await api('/recordings/' + state.rid + '/rerun', { method: 'POST' });
      poll();
    };
    $('#btnStart').disabled = false;
    return;
  }
  setTimeout(poll, 2500);
}

/* ---------- 断点续录 ---------- */
async function checkResume() {
  const rid = localStorage.getItem('fm_rid');
  if (!rid) return;
  try {
    const rec = await api('/recordings/' + rid);
    if (rec.status === 'recording' && rec.segment_count > 0) {
      const box = $('#resume');
      box.style.display = 'block';
      box.innerHTML = '<div class="meta">上次有一段未完成的录音</div>' +
        '<div style="font-weight:600;margin:4px 0 10px">' + escHtml(rec.title) + ' · 已上传 ' + rec.segment_count + ' 段</div>' +
        '<div class="row"><button id="btnResume">继续录音</button><button id="btnIgnore" class="ghost">忽略</button></div>';
      document.getElementById('btnResume').onclick = () => { box.style.display = 'none'; startResume(rec); };
      document.getElementById('btnIgnore').onclick = () => { localStorage.removeItem('fm_rid'); box.style.display = 'none'; };
    } else {
      localStorage.removeItem('fm_rid');
    }
  } catch (e) { localStorage.removeItem('fm_rid'); }
}
async function startResume(rec) {
  state.rid = rec.id;
  state.idx = rec.next_segment_index || rec.segment_count || 0;
  state.pending = [];
  $('#result').style.display = 'none';
  $('#status').textContent = '';
  $('#btnStart').disabled = true;
  $('#btnStop').disabled = false;
  log('继续录音：' + rec.id + '，从第 ' + (state.idx + 1) + ' 段开始');
  state.rec = new WavRecorder();
  await state.rec.start();
  acquireWakeLock();
  state.running = true;
  state.startedAt = Date.now();
  $('#dot').style.display = 'inline-block';
  state.tick = setInterval(tick, 500);
  state.rotate = setTimeout(rotateSegment, SEG_MS);
}

/* ---------- 录音记录 ---------- */
let RECS = [];
async function loadRecords() {
  try { RECS = await api('/recordings'); } catch (e) { RECS = []; }
  renderRecords();
}
function hoursAgo(iso) { return (Date.now() - new Date(iso).getTime()) / 3600000; }
function renderRecords() {
  const range = $('#recRange').value;
  const q = $('#recSearch').value.trim().toLowerCase();
  const list = RECS.filter((r) => {
    if (q && !(r.title || '').toLowerCase().includes(q)) return false;
    if (range === 'all') return true;
    if (range === 'today') return new Date(r.created_at).toDateString() === new Date().toDateString();
    return hoursAgo(r.created_at) <= Number(range) * 24;
  });
  $('#recCount').textContent = list.length ? list.length + ' 条' : '';
  if (!list.length) { $('#recList').innerHTML = '<div class="empty">暂无录音记录</div>'; return; }
  $('#recList').innerHTML = list.map((r) => {
    const d = new Date(r.created_at);
    const when = isNaN(d) ? r.created_at : d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const dur = r.duration_sec ? Math.round(r.duration_sec / 60 * 10) / 10 + ' 分钟' : '';
    const label = { done: '已完成', failed: '失败', recording: '录音中', queued: '排队中', transcribing: '转写中', summarizing: '生成纪要' }[r.status] || r.status;
    return '<div class="rec-item"><div class="rec-main">' +
      '<a class="rec-title" href="/d/' + r.id + '">' + escHtml(r.title) + '</a>' +
      '<div class="rec-meta">' + when + (dur ? ' · ' + dur : '') + ' · ' + label + '</div></div>' +
      '<button class="ghost rec-del" data-id="' + r.id + '">移除</button></div>';
  }).join('');
  document.querySelectorAll('.rec-del').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm('移除这条录音记录？音频与纪要将一并删除。')) return;
      btn.disabled = true;
      try { await api('/recordings/' + btn.dataset.id, { method: 'DELETE' }); }
      catch (e) { alert('移除失败：' + e.message); btn.disabled = false; return; }
      await loadRecords();
    };
  });
}
$('#recRange').addEventListener('change', renderRecords);
$('#recSearch').addEventListener('input', renderRecords);

/* ---------- 事件与初始化 ---------- */
$('#btnStart').onclick = async () => {
  try { await startSession(); }
  catch (e) {
    const name = (e && e.name) || '';
    const hint = name === 'NotAllowedError' ? '麦克风权限被拒绝：请在浏览器/飞书设置里允许麦克风后重试。'
      : name === 'NotFoundError' ? '没有找到麦克风设备。'
      : name === 'NotReadableError' ? '麦克风被其他应用占用，关闭录音类应用后重试。'
      : e.message;
    log('启动失败：' + hint);
    $('#btnStart').disabled = false;
  }
};
$('#btnStop').onclick = stopSession;
$('#btnRelogin').onclick = () => ensureLogin();
window.addEventListener('online', () => { if (state.pending.length) pump(); });

window.addEventListener('load', () => {
  if (!$('#title').value) $('#title').value = autoTitle();
  ensureLogin().then(() => { checkResume(); loadRecords(); });
});

</script>
