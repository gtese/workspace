<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的纪要</title>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main>
  <div class="hero">
    <div class="brand">
      <span class="chip-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="3" fill="#1f6feb" opacity=".92"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#eaf3ff"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6M6 5l4 4M22 23l4 4M26 5l-4 4M10 23l-4 4" stroke="#4c9aff" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="1.6" fill="#1f6feb"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>我的纪要 <span class="badge">AI</span></h1>
        <div class="sub">历史录音 · 全文搜索 · 分享</div>
      </div>
      <a class="nav" href="/">去录音 →</a>
    </div>
    <div class="sub" id="who" style="margin-top:10px"></div>
  </div>
  <div class="stats" id="stats"></div>
  <input id="q" placeholder="搜索纪要内容、标题…" autocomplete="off">
  <div id="list"><div class="empty">加载中…</div></div>
</main>
<script>
const uid = localStorage.getItem('fm_uid') || 'demo';
const token = localStorage.getItem('fm_token') || '';
const headers = { 'X-Employee-Open-Id': uid, ...(token ? { Authorization: 'Bearer ' + token } : {}) };
const LABEL = {
  created: ['草稿', ''], recording: ['录音中', 'busy'], queued: ['排队中', 'busy'],
  transcribing: ['转写中', 'busy'], transcribed: ['转写完成', 'busy'], summarizing: ['生成纪要', 'busy'],
  done: ['已完成', 'done'], failed: ['失败', 'failed'],
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function load() {
  const meResp = await fetch('/api/v1/me', { headers }).catch(() => null);
  if (meResp && meResp.status === 401) {
    document.getElementById('list').innerHTML = '<div class="card"><h2>需要登录飞书</h2><p class="meta">请从飞书工作台打开本应用后再查看。</p></div>';
    document.getElementById('stats').innerHTML = '';
    return;
  }
  const me = meResp ? await meResp.json().catch(() => ({})) : {};
  const [stats, list] = await Promise.all([
    fetch('/api/v1/stats', { headers }).then(r => r.json()).catch(() => ({})),
    fetch('/api/v1/recordings', { headers }).then(r => r.json()).catch(() => []),
  ]);
  document.getElementById('who').textContent = me.name ? '当前用户：' + esc(me.name) : '模拟身份：' + uid;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${stats.recordings ?? 0}</b><span>录音数</span></div>
    <div class="stat"><b>${stats.minutes ?? 0}</b><span>总分钟</span></div>
    <div class="stat"><b>¥${stats.estimated_cost_yuan ?? 0}</b><span>预估转写成本</span></div>`;
  if (!list.length) {
    document.getElementById('list').innerHTML = '<div class="empty">还没有录音，去录一段吧</div>';
    return;
  }
  document.getElementById('list').innerHTML = list.map(r => {
    const [label, cls] = LABEL[r.status] || [r.status, ''];
    const d = new Date(r.created_at);
    const when = isNaN(d) ? r.created_at : d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const dur = r.duration_sec ? Math.round(r.duration_sec / 60 * 10) / 10 + ' 分钟' : '—';
    return `<a class="item" href="/d/${r.id}">
      <div class="row"><span class="title">${esc(r.title)}</span><span class="pill ${cls}">${label}</span></div>
      <div class="meta">${when} · ${dur} · ${r.segment_count} 段</div>
      ${r.error ? `<div class="meta" style="color:#f87171">${esc(r.error).slice(0, 80)}</div>` : ''}
    </a>`;
  }).join('');
}
function renderList(list) {
  if (!list.length) {
    document.getElementById('list').innerHTML = '<div class="empty">没有匹配的纪要</div>';
    return;
  }
  document.getElementById('list').innerHTML = list.map(r => {
    const [label, cls] = LABEL[r.status] || [r.status, ''];
    const d = new Date(r.created_at);
    const when = isNaN(d) ? r.created_at : d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const dur = r.duration_sec ? Math.round(r.duration_sec / 60 * 10) / 10 + ' 分钟' : '—';
    return `<a class="item" href="/d/${r.id}">
      <div class="row"><span class="title">${esc(r.title)}</span><span class="pill ${cls}">${label}</span></div>
      <div class="meta">${when}${r.duration_sec ? ' · ' + dur : ''}${r.segment_count != null ? ' · ' + r.segment_count + ' 段' : ''}</div>
      ${r.snippet ? `<div class="snippet">…${esc(r.snippet)}…</div>` : ''}
    </a>`;
  }).join('');
}

let searchTimer = null;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(async () => {
    if (!q) { load(); return; }
    const hits = await fetch('/api/v1/search?q=' + encodeURIComponent(q), { headers }).then(r => r.json()).catch(() => []);
    renderList(hits);
  }, 250);
});

load();
</script>
</body>
</html>
