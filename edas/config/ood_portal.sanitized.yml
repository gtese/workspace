---
servername: edas.tri.local

ssl:
  - 'SSLCertificateFile "/etc/pki/tls/certs/tri.local_wildcard_fullchain.crt"'
  - 'SSLCertificateKeyFile "/etc/pki/tls/private/tri.local_wildcard.key"'

auth:
  - 'AuthType openid-connect'
  - 'Require valid-user'

logout_redirect: '/oidc?logout=https%3A%2F%2Fedas.tri.local'

user_map_match: '.*'

oidc_uri: '/oidc'
oidc_provider_metadata_url: 'https://sso.tri.local/realms/tri/.well-known/openid-configuration'
oidc_client_id: 'ood'
oidc_client_secret: <redacted>
oidc_remote_user_claim: 'preferred_username'
oidc_scope: 'openid profile email'
oidc_crypto_passphrase: <redacted>
oidc_session_inactivity_timeout: 28800
oidc_session_max_duration: 28800
oidc_state_max_number_of_cookies: '10 true'
oidc_settings:
  OIDCPassIDTokenAs: 'serialized'
  OIDCPassRefreshToken: 'On'
  OIDCPassClaimsAs: 'environment'
  OIDCStripCookies: 'mod_auth_openidc_session mod_auth_openidc_session_chunks mod_auth_openidc_session_0 mod_auth_openidc_session_1'
  OIDCResponseType: 'code'

node_uri: '/node'
rnode_uri: '/rnode'

pun_pre_hook_root_cmd: '/opt/ood/nginx_stage/sbin/ood-pun-prehook'
