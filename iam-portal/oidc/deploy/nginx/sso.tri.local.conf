# nginx —— sso.tri.local 反向代理与 TLS 终止
# 部署路径：/etc/nginx/conf.d/sso.tri.local.conf（由 deploy.sh 安装）
#
# 证书：tri.local 通配证书（*.tri.local，企业根 CA 签发，含中间证书 → fullchain）
#   /etc/pki/tls/oidc/tri.local.crt       (leaf + intermediate)
#   /etc/pki/tls/oidc/tri.local.key
#
# 为什么由 nginx 做 TLS 终止而 Keycloak 只跑 HTTP：
#   1) 与现有 man/ai/chat 的部署方式一致，证书集中一处管理；
#   2) Keycloak 用 --proxy-headers=xforwarded，生成的 iss / 登录地址正确；
#   3) 避免容器内再维护一份证书与私钥。
#
# ⚠️ 必须带 Host 头与 X-Forwarded-Proto，否则 Keycloak 生成的 issuer
#    会变成容器内地址（http://kc-1:8080/realms/tri），所有 client 校验 iss 全部失败。

upstream kc_backend {
    server 127.0.0.1:18080 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:18081 max_fails=2 fail_timeout=10s backup;
    keepalive 32;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name sso.tri.local;
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.14（Rocky 8 自带）：http2 写在 listen 上；
    # 升级到 nginx 1.25+ 后改为独立的 `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sso.tri.local;

    # ---- TLS：必须 fullchain（Safari 对证书链完整性比 Chrome 严格）----
    ssl_certificate     /etc/pki/tls/oidc/tri.local.crt;
    ssl_certificate_key /etc/pki/tls/oidc/tri.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:oidcSSL:10m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 登录用户名口令走 POST；不允许超大请求体
    client_max_body_size 2m;
    client_body_timeout  30s;
    keepalive_timeout    65s;

    access_log /var/log/nginx/sso.access.log;
    error_log  /var/log/nginx/sso.error.log;

    # 管理控制台：只允许服务器本机与内网网段（员工浏览器不会用到）
    location /admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://kc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # 健康检查与指标：只允许本机（监控可另行放行）
    location ~ ^/(health|metrics)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://kc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # 其余（/realms/tri/... 所有 OIDC 端点与登录页）
    location / {
        proxy_pass http://kc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }
}