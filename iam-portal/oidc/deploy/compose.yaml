# ============================================================
# 企业统一身份平台（Keycloak）— 生产编排定义
# ============================================================
# 宿主机：trivm101.tri.local (172.16.50.101)
# 域名：  https://sso.tri.local
#
# 拓扑：
#   nginx(宿主 443, TLS 终止) ──► kc-1:8080 / kc-2:8080   （Keycloak 集群，两个实例）
#   kc-1 / kc-2               ──► postgres:5432             （同库，JDBC_PING 组集群）
#   kc-1 / kc-2               ──LDAPS 636──► tri-sh-dc01 / dc02.tri.local（AD）
#
# 运行方式：rootless podman（用户 linyiyao）+ systemd 用户单元开机自启
#   ./deploy/deploy.sh install      # 首次部署
#   podman-compose -f deploy/compose.yaml ps
#
# 约束：
#  - 所有容器端口只绑定 127.0.0.1，对外只暴露 nginx 的 443
#  - Keycloak 以 production 模式运行（start --optimized，构建期做过 build）
#  - 集群发现用 JDBC_PING（共享数据库），不依赖组播（内网禁组播）
# ============================================================

x-kc: &kc
  image: localhost/tri-oidc-keycloak:1.0.0
  restart: unless-stopped
  # 镜像内以 UID 1000 运行；rootless 下用 keep-id 与宿主 UID 对齐，避免挂载卷权限问题
  userns_mode: "keep-id"
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
    interval: 20s
    timeout: 5s
    retries: 10
    start_period: 120s
  networks:
    - oidc
  extra_hosts:
    # 与 knowledge-hub / rnd-timesheet 一致：podman 内置 DNS 偶发 EAI_AGAIN，加静态映射兜底
    - "db:10.89.3.10"
    - "kc-1:10.89.3.11"
    - "kc-2:10.89.3.12"

x-kc-env: &kc-env
  # 引导管理员：仅在数据库里不存在该用户时创建（两个实例就读同一份，不会重复创建）。
  # 登录后请在控制台把密码改掉，并从 .env 中删除这两项。
  KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?必须在 .env 中设置}
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-keycloak}
  KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
  KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}
  # 生产模式：对外 https，由 nginx 做 TLS 终止；Keycloak 内部只跑 HTTP
  KC_HOSTNAME: https://sso.tri.local
  KC_HOSTNAME_STRICT: "true"
  KC_PROXY_HEADERS: xforwarded
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "8080"
  KC_HTTP_MANAGEMENT_PORT: "9000"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  # 集群：Infinispan + JDBC_PING，两实例共享数据库；同网段用 kubernetes 栈基于 DNS 发现
  KC_CACHE: ispn
  KC_CACHE_STACK: tcp
  # 双节点静态成员表：不依赖 DNS/组播，容器固定 IP 最稳
  JAVA_OPTS_APPEND: >-
    -Djgroups.bind_addr=site_local
    -Djgroups.tcpping.initial_hosts=kc-1[7800],kc-2[7800]
    -Djava.net.preferIPv4Stack=true
    -Xms512m -Xmx1536m
  KC_LOG: console
  KC_LOG_LEVEL: INFO
  TZ: Asia/Shanghai

services:
  # ============================================================
  # PostgreSQL 16 — Keycloak 独立库（与 kb / timesheet 物理隔离）
  # ============================================================
  db:
    image: docker.1panel.live/library/postgres:16-alpine
    container_name: oidc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - oidc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      oidc:
        ipv4_address: 10.89.3.10

  # ============================================================
  # Keycloak 实例 1
  # ============================================================
  kc-1:
    <<: *kc
    container_name: oidc-kc-1
    command: ["start", "--optimized"]
    ports:
      - "127.0.0.1:18080:8080"   # HTTP，由 nginx 转发
      - "127.0.0.1:19000:9000"   # 管理/健康/指标，仅本机
    environment:
      <<: *kc-env
    networks:
      oidc:
        ipv4_address: 10.89.3.11

  # ============================================================
  # Keycloak 实例 2（双实例：单点故障时登录不中断）
  # ============================================================
  kc-2:
    <<: *kc
    container_name: oidc-kc-2
    command: ["start", "--optimized"]
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:19001:9000"
    environment:
      <<: *kc-env
    networks:
      oidc:
        ipv4_address: 10.89.3.12

volumes:
  oidc-pgdata:
    name: oidc-pgdata

networks:
  oidc:
    name: oidc
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.3.0/24
          gateway: 10.89.3.1