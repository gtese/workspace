# nginx —— 企业应用门户 portal.tri.local
# 部署路径：/etc/nginx/conf.d/portal.tri.local.conf
#
# portal.tri.local 原先没有站点，请求会落到第一个 443 server（chat）上，
# 因此新增本文件，把该域名指向门户容器。
upstream tri_portal { server 127.0.0.1:8095; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name portal.tri.local;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.tri.local;

    ssl_certificate     /etc/pki/tls/certs/tri.local.crt;
    ssl_certificate_key /etc/pki/tls/private/tri.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:portalSSL:10m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    # 健康检查只允许本机（监控可另行放行）
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://tri_portal;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://tri_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }
}
