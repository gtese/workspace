# nginx —— TraceWork 反向代理与 TLS 终止
# 主域名：work.tri.local；兼容保留：man.tri.local
# 部署路径：/etc/nginx/conf.d/man.tri.local.conf
#
# 证书：tri.local 通配证书（*.tri.local），由域控企业根 CA 签发。
#   /etc/pki/tls/certs/man.tri.local.crt        (fullchain)
#   /etc/pki/tls/private/man.tri.local.key
#   /etc/pki/tls/certs/tri.local_ca.crt         (用于 OCSP/链校验)

# 上游：容器中的应用
upstream rnd_timesheet {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name work.tri.local man.tri.local;

    # 保留 ACME/健康检查路径（如需）
    location /.well-known/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.14（RHEL/Rocky 8 自带）用 listen 上的 http2 参数；
    # 若升级到 nginx 1.25+，请改为独立的 `http2 on;` 指令。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name work.tri.local man.tri.local;

    # ---- TLS ----
    ssl_certificate     /etc/pki/tls/certs/man.tri.local.crt;
    ssl_certificate_key /etc/pki/tls/private/man.tri.local.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        off;   # 内网 CA 无 OCSP，关闭以避免握手延迟

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "same-origin" always;

    # 上传/请求体限制
    client_max_body_size 8m;
    client_body_timeout  60s;

    access_log /var/log/nginx/tracework.access.log;
    error_log  /var/log/nginx/tracework.error.log warn;

    # ---- 应用 ----
    location / {
        proxy_pass         http://rnd_timesheet;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Cookie 已由应用设置 HttpOnly/Secure，这里不做改写
    }

    # 静态资源长缓存（文件名带内容哈希）
    # 带内容哈希的构建产物可以长期缓存（文件名变了就是新文件）
    location /assets/ {
        proxy_pass http://rnd_timesheet;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 入口必须每次回源校验，否则用户会拿到引用「已删除旧 chunk」的旧 index.html，
    # 导致页面白屏、路由打不开（部署新版本后最常见的问题）。
    location = /index.html {
        proxy_pass http://rnd_timesheet;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # 健康检查不对公网暴露细节
    location = /api/health {
        proxy_pass http://rnd_timesheet;
        access_log off;
    }
}